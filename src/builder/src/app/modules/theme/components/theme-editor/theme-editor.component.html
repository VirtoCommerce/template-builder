<app-panel>
  <div title-content>
    <div class="grow pl-2">
      Theme settings
    </div>
    <div>
    <app-icon-button (click)="onPresetsClick()" icon="tune" text="Presets" skin="link" />
    </div>
  </div>
  <div class="flex flex-col">
    @if (uiState(); as uiState) {
      @if (schema(); as schema) {
        @for (group of schema; track group) {
          <div class="group">
            <div (click)="toggleGroup(group)" class="list-item group-title">
              <div class="group-name" [attr.title]="group.name">
                {{group.name}}
              </div>
              <div>
                <app-chevron [opened]="uiState[group.name].opened" />
              </div>
            </div>
            @if (uiState[group.name].opened) {
              @if (settings(); as settings) {
                <app-dynamic-form [sectionModel]="$any(settings)"
                  [descriptors]="group.settings"
                  [context]="context"
                (modelChanged)="onSettingsChanged($event)" />
              }
            }
          </div>
        }
      }
    }
  </div>
</app-panel>
@if (editableGroup(); as editableGroup) {
  @if (settings(); as settings) {
    <app-settings-panel [context]="context"
      [group]="editableGroup"
      [settings]="settings"
      (backClick)="onBackClick(editableGroup)"
    (settingsChanged)="onSettingsChanged($event)" />
  }
}
