<div cdkDropList class="blocks-container" (cdkDropListDropped)="onReorderBlocks($event)">
    <ng-container *ngFor="let block of section.blocks">
        <div class="block-item"
             cdkDragBoundary=".blocks-container"
             cdkDragLockAxis="y"
             [ngClass]="{ 'selected': states[block.id]?.selected }"
             (mouseenter)="currentHoverId = block.id"
             (mouseleave)="currentHoverId = null"
             cdkDrag>
            <app-section-item [sectionSchema]="blocksSchemas[block.type]"
                              [selectable]="states[block.id].selectable"
                              [selected]="states[block.id].selected"
                              [hasContextMenu]="true"
                              [section]="block"
                              (itemClick)="onItemClick(block)"
                              (actionClick)="onActionExecuted($event, block)"
                              (itemSelectChanged)="onItemSelectChanged($event, block.id)">
            </app-section-item>
            <app-drag-handle [visible]="block.id === currentHoverId || states[block.id]?.selected || false" cdkDragHandle></app-drag-handle>
        </div>
    </ng-container>
</div>
<app-icon-button icon="add"
                 skin="blue"
                 text="Add block"
                 (click)="onAddBlockClick()"></app-icon-button>
