<app-panel>
    <div class="p-4">
        <ng-container *ngIf="{
            template: template$|async,
            templateState: templateState$|async,
            sectionsState: sectionsState$|async,
            sectionsSchemas: sectionsSchemas$|async,
            blocksSchemas: blocksSchemas$|async
        } as ctx">
            <div cdkDropList class="sections-container" (cdkDropListDropped)="reorderSections($event)">
                <ng-container *ngFor="let section of ctx.template!.content">
                    <app-collapsible-list-item [expandable]="ctx.sectionsState![section.__id].canHaveChildren || false"
                                               [opened]="ctx.sectionsState![section.__id].expanded"
                                               cdkDragBoundary=".sections-container"
                                               cdkDragLockAxis="y"
                                               cdkDrag
                                               (cdkDragStarted)="sectionDragStarted($event)"
                                               (cdkDragReleased)="sectionDragCompleted($event)"
                                               (openChanged)="toggleSection(section.__id, ctx.templateState!.id)">
                        <div item>
                            <div class="item-holder">
                                <app-section-item [sectionSchema]="$any(ctx.sectionsSchemas![section.type])"
                                                  [section]="section"
                                                  (itemClick)="onSectionClick()">
                                </app-section-item>
                                <app-drag-handle cdkDragHandle></app-drag-handle>
                            </div>
                        </div>
                        <app-section-children-list [section]="section"
                                                   [blocksSchemas]="ctx.blocksSchemas!"
                                                   (itemClick)="onBlockClick()"
                                                   (addBlockClick)="addBlockClick()">
                        </app-section-children-list>
                    </app-collapsible-list-item>
                </ng-container>
            </div>
        </ng-container>
    </div>
    <div title-content class="w-full">
        <div class="w-full flex flex-row">
            <div [attr.title]="templateName$|async" class="template-name">{{ templateName$ | async }}</div>
            <app-context-menu [visible]="true" [actions]="$any([{ title: 'action 1' }])"></app-context-menu>
        </div>
    </div>
    <div footer-content>
        <app-icon-button icon="add" skin="blue" text="Add section" (click)="addSectionClick()"></app-icon-button>
    </div>
</app-panel>
