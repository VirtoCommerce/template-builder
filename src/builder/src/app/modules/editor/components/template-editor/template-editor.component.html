<div class="panel-title">
    <div>{{ getTemplateName() }}</div>
    <div>
        <app-toolbar-button icon="settings"></app-toolbar-button>
    </div>
</div>
<div class="panel-body">
    <ng-container *ngIf="template">
        <app-section-item *ngFor="let section of template.content" (click)="onItemClick()" [section]="section">
        </app-section-item>
    </ng-container>
</div>
<div class="footer">
    <button class="bg-primary" type="button" (click)="addButtonClick()">
        <img src="assets/icons/plus.svg" />
        Add section
    </button>
</div>
