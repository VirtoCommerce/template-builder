<app-overlap-panel [skipTranslate]="isHalfScreen$|async" [expandable]="false">
    <app-panel>
        <div>
            <ul class="flex flex-col">
                <ng-container *ngIf="viewModel$|async as vm">
                    <li class="search-holder">
                        <input placeholder="Search in library"
                               class="search"
                               type="search"
                               [value]="filter$|async"
                               (keyup)="applySectionsFilter($event)"
                               (search)="applySectionsFilter($event)" />
                    </li>
                    <li *ngFor="let group of vm.groups" class="border-b">
                        <app-add-section-group [group]="group"
                                               [opened]="vm.states.groups[group.name].opened"
                                               [underPreviewType]="vm.states.previewItemType"
                                               (onOpened)="onToggleGroup(group)"
                                               (onPreview)="onPreviewItem($event)"
                                               (onAdd)="onAddItem($event)">
                        </app-add-section-group>
                    </li>
                    <li *ngFor="let item of vm.items" class="border-b">
                        <app-add-section-item [section]="item"
                                              [inPreview]="item.type === vm.states.previewItemType"
                                              (onPreview)="onPreviewItem(item)"
                                              (onAdd)="onAddItem(item)"></app-add-section-item>
                    </li>
                    <ng-container
                                  *ngIf="(filter$|async) && !(vm.groups|keyvalue).length && !(vm.items|keyvalue).length">
                        <li class="p-4 text-gray-300">
                            {{ !!vm.parentSection ? 'No blocks found' : 'No sections found' }}
                        </li>
                    </ng-container>
                </ng-container>
            </ul>
        </div>
        <ng-container title-content>
            <div class="title">
                <app-icon class="back-icon" [hoverable]="true" (click)="onCancelClick()" title="Cancel">chevron_left
                </app-icon>
                <div>{{ title$|async }}</div>
            </div>
        </ng-container>
    </app-panel>
</app-overlap-panel>
