<app-overlap-panel>
    <app-panel>
        <ng-container *ngIf="viewModel$|async as vm">
            <app-dynamic-form [context]="vm.editContext"
                              [descriptors]="vm.schema.settings"
                              [sectionModel]="vm.section"
                              (modelChanged)="onModelChanged($event)"></app-dynamic-form>
        </ng-container>
        <ng-container title-content>
            <div class="title">
                <app-icon class="back-icon" (click)="onBackClick()" [hoverable]="true" title="Back">chevron_left
                </app-icon>
                <ng-container *ngIf="viewModel$|async as vm">
                    <div class="info" [ngClass]="{ 'invisible-section': vm.section.hidden }">
                        <div class="whitespace-normal">{{ sectionName$|async }}</div>
                        <div class="section-info">
                            <span [cdkCopyToClipboard]="vm.section.type">Type: {{ vm.section.type }}<app-icon
                                          [inline]="true">content_copy</app-icon></span><br />
                            <span [cdkCopyToClipboard]="vm.section.id">ID: {{ vm.section.id }}<app-icon [inline]="true">
                                    content_copy</app-icon></span>
                        </div>
                    </div>
                    <app-context-menu [visible]="true"
                                      [getActions]="getItemActionsFactory(vm.section)"
                                      (onAction)="onContextMenuAction($event, vm.section)"></app-context-menu>
                </ng-container>
            </div>
        </ng-container>
    </app-panel>
</app-overlap-panel>
