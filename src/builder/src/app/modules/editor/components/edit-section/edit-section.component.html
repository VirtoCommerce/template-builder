<app-overlap-panel>
    <app-panel>
        <div class="form-holder">
            <app-dynamic-form [context]="context"
                      [descriptors]="descriptors.settings"
                      [sectionModel]="section"></app-dynamic-form>
        </div>
        <ng-container title-content>
            <div class="title">
                <app-icon (click)="onBackClick()" title="Back">chevron_left</app-icon>
                <div class="info">
                    <div>Section title</div>
                    <div class="section-info">
                        Type: section-type<br />
                        ID: section-id
                    </div>
                </div>
                <app-context-menu [visible]="true" [actions]="itemActions"></app-context-menu>
            </div>
        </ng-container>
    </app-panel>
