<app-overlap-panel>
    <app-panel>
        <ng-container *ngIf="viewModel$|async as vm">
            <app-dynamic-form [context]="vm.editContext"
                              [descriptors]="vm.schema.settings"
                              [sectionModel]="vm.section"></app-dynamic-form>
        </ng-container>
        <ng-container title-content>
            <ng-container *ngIf="viewModel$|async as vm">
                <div class="title">
                    <app-icon (click)="onBackClick()" title="Back">chevron_left</app-icon>
                    <div class="info">
                        <div class="whitespace-normal">{{ sectionName$|async }}</div>
                        <div class="section-info">
                            Type: {{ vm.section.type }}<br />
                            ID: {{ vm.section.id }}
                        </div>
                    </div>
                    <app-context-menu [visible]="true" [actions]="itemActions"></app-context-menu>
                </div>
            </ng-container>
        </ng-container>
    </app-panel>
</app-overlap-panel>
