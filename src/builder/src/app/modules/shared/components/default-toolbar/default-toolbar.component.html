<app-custom-actions></app-custom-actions>
<div class="flex-grow flex justify-center">
    <app-template-selector
        [templates]="templates$|async"
        [currentTemplate]="currentTemplate$|async"
        (templateSelected)="onTemplateChanged($event)"></app-template-selector>
</div>
<ng-container *ngIf="panels">
    <app-actions-panel [panels]="panels"
                       (actionExecuted)="onActionExecuted($event)">
    </app-actions-panel>
</ng-container>
