<app-multipage-select
    filterPlaceholder="Search"
    panelClass="template-selector-panel"
    [attr.title]="'Templates'"
    [items]="templates$|async"
    [default]="{ title: 'Choose template', alias: '' }"
    [current]="currentTemplate$|async"
    (filterChanged)="onFilterChanged($event)"
    (itemSelected)="onTemplateSelected($event)"
    (childrenRequested)="onChildrenRequested($event)"
></app-multipage-select>
