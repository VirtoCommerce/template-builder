<div class="preview-wrapper" [ngClass]="{ 'preview-mode': (isPreviewMode$|async) }">
    <div *ngIf="isPreviewMode$|async" class="preview-name">Preset preview: {{ previewPresetName$|async }}</div>
    <div class="iframe-holder">
        <ng-container *ngIf="previewUrl$|async as previewUrl">
            <iframe id="preview-frame-component" [src]="previewUrl"></iframe>
        </ng-container>
    </div>
</div>
