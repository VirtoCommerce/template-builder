<div class="py-2 flex" (click)="onItemClick($event)">
    <img *ngIf="icon" class="mr-1" [src]="'assets/icons/sections/' + icon + '.svg'" />
    <span class="flex-grow">{{ title }}</span>
    <img *ngIf="showPlus" class="ml-1" src="assets/icons/round-plus.svg" (click)="onPlusClick($event)" />
</div>
