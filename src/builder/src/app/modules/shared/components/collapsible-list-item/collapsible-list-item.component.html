<div class="section-item" (click)="sectionClick($event)" [ngClass]="{ 'opened': opened }">
    <img *ngIf="icon" [src]="'assets/icons/sections/' + icon + '.svg'" />
    <span class="name">{{title}}</span>
    <app-visibility-button *ngIf="showVisibility" [visible]="visible" (visibleChanged)="onVisibleChanged($event)"></app-visibility-button>
    <img *ngIf="closable" class="chevron" src="assets/icons/chevron.svg" (click)="toggle($event)" />
    <img *ngIf="showPlus" src="assets/icons/round-plus.svg" (click)="onPlusClick($event)" />
    <ng-content select="[drag]"></ng-content>
</div>
<ng-container *ngIf="closable && opened">
    <ng-content></ng-content>
</ng-container>
