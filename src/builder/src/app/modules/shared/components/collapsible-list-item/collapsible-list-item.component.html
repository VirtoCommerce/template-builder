<div class="section-item" (click)="sectionClick($event)">
    <mat-icon>{{ icon }}</mat-icon>
    <span class="name">{{ section['title'] }}</span>
    <app-visibility-button [visible]="!section['hidden']"
        (visibleChanged)="onVisibleChanged($event)"></app-visibility-button>

    <img *ngIf="showPlus" src="assets/icons/round-plus.svg" (click)="onPlusClick($event)" /> -->
</div>
