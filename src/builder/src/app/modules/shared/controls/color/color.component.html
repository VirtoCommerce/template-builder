<div class="flex items-center" [colorPicker]="controlValue"
    [cpOutputFormat]="descriptor.outputFormat || 'auto'"
    [cpOKButton]="true"
    [cpCancelButton]="true"
    cpCancelButtonText="Clear"
    (colorPickerCancel)="clearColor()"
    (colorPickerChange)="changeColor($event)"
    >
    <div class="border rounded-full w-4 h-4 mr-2" [ngStyle]="{ backgroundColor: controlValue }"></div>
    <label [attr.title]="descriptor.hint">{{ descriptor.label }}</label>
</div>
