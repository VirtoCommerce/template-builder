<button mat-button [matMenuTriggerFor]="menu"
        class="menu-button"
        (menuOpened)="isOpened = true"
        (menuClosed)="isOpened = false">
    <span class="btn-inner">
        <ng-container *ngIf="activeItem">
            <app-icon *ngIf="activeItem.icon">{{ activeItem.icon }}</app-icon>
            <div *ngIf="activeItem.title" class="text active-item-text truncate" [attr.title]="activeItem.title">{{
                activeItem.title }}</div>
        </ng-container>
        <div class="text default-title-text" *ngIf="!active && !!defaultTitle">{{ defaultTitle }}</div>
        <app-chevron *ngIf="displayChevron" [opened]="isOpened" [vertical]="true"></app-chevron>
    </span>
</button>
<mat-menu #menu="matMenu" [class]="'menu-panel ' + panelClass || ''">
    <div class="flex flex-col p-1">
        <button mat-menu-item *ngFor="let action of actions" (click)="actionChoosed(action)">
            <span class="item-inner">
                <app-icon *ngIf="action.icon">{{ action.icon }}</app-icon>
                <span class="text-item" [attr.title]="action.title">{{ action.title }}</span>
            </span>
        </button>
    </div>
</mat-menu>
