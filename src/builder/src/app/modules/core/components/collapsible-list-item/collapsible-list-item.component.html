<div class="item-holder" [ngClass]="{ 'hovered': hovered, 'highlighted': highlight }">
    <app-chevron [ngStyle]="{ visibility: expandable ? 'visible' : 'hidden' }"
        (click)="onChevronClick()" [opened]="opened"></app-chevron>
    <ng-content select="[item]"></ng-content>
</div>
<div *ngIf="opened" class="pl-8">
    <ng-content ></ng-content>
</div>
