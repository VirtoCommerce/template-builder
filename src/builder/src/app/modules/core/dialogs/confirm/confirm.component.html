<div class="flex flex-row space-x-8 items-start">
    <app-icon *ngIf="icon" style="color: #D72C0D;">{{ icon }}</app-icon>
    <div>
        <div mat-dialog-content> {{ title }} </div>
        <div mat-dialog-actions>
            <div class="flex flex-row space-x-2">
                <app-icon-button (click)="confirm()" skin="primary" [text]="confirmText"></app-icon-button>
                <app-icon-button (click)="decline()" skin="outline" [text]="declineText"></app-icon-button>
            </div>
        </div>
    </div>
</div>
