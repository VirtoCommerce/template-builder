<div class="flex flex-row items-center justify-between w-full">
    <label [attr.title]="descriptor?.hint" class="pb-label">{{ descriptor?.label }}</label>
    <span *ngIf="descriptor?.type === 'slider'">{{ controlValue }}</span>
</div>

<input #control
    *ngIf="descriptor?.type !== 'slider'"
    type="number"
    class="control"
    [min]="descriptor?.min"
    [max]="descriptor?.max"
    [step]="descriptor?.step"
    [value]="controlValue"
    [placeholder]="descriptor?.placeholder || ''"
    (paste)="onPaste($event)"
    (keyup)="raiseOnChange($event.target)"
    (change)="raiseOnChange($event.target)"
    (blur)="raiseOnTouched($event.target)"
/>

<mat-slider
    *ngIf="descriptor?.type === 'slider'"
    [min]="descriptor?.min"
    [max]="descriptor?.max"
    [step]="descriptor?.step"
    [discrete]="descriptor?.thumb || false"
    [ngClass]="{ 'has-thumb': descriptor?.thumb }"
><input matSliderThumb [value]="controlValue" (valueChange)="sliderChanged($event)"></mat-slider>

<p *ngIf="descriptor?.info" class="info">{{ descriptor?.info }}</p>
