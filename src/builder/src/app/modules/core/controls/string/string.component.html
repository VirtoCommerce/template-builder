<label [attr.title]="descriptor.hint" class="pb-label">{{ descriptor.label }}</label>

<input *ngIf="!descriptor.multiline"
    #control
    type="text"
    class="control"
    [value]="controlValue"
    [placeholder]="descriptor.placeholder || ''"
    (keyup)="raiseOnChange($event)"
/>

<textarea *ngIf="descriptor.multiline"
    #textarea
    rows="4"
    class="control"
    [value]="controlValue"
    [placeholder]="descriptor.placeholder || ''"
    (keyup)="raiseOnChange($event)"
></textarea>

<p *ngIf="descriptor.info" class="info">{{ descriptor.info }}</p>
