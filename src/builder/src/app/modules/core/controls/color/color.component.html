<!-- picker on click -->
<ng-container *ngIf="!descriptor.inline; else inlinePicker">
    <div class="flex items-center justify-between"
         (click)="togglePopover()">
        <label class="pb-label" [attr.title]="descriptor.hint">{{ descriptor.label }}</label>
        <div #trigger="cdkOverlayOrigin"
             class="border rounded w-7 h-7 mr-2"
             cdkOverlayOrigin
             [ngStyle]="{ backgroundColor: controlValue }"></div>
    </div>
    <ng-template cdkConnectedOverlay
                 [cdkConnectedOverlayOrigin]="trigger"
                 [cdkConnectedOverlayOpen]="isOpen"
                 [cdkConnectedOverlayPositions]="positions"
                 [cdkConnectedOverlayHasBackdrop]="true"
                 [cdkConnectedOverlayLockPosition]="true"
                 (detach)="close()"
                 (backdropClick)="outsideClick($event)">
        <div class="picker-holder">
            <color-sketch *ngIf="descriptor.colorMode !== 'presets'"
                          class="sketch-color-picker-component"
                          [className]="'popup-color-picker'"
                          [color]="controlValue || ''"
                          [presetColors]="descriptor.presets || []"
                          [disableAlpha]="descriptor.disableAlpha || false"
                          (onChangeComplete)="changeColor($event)"></color-sketch>
            <color-twitter *ngIf="descriptor.colorMode === 'presets'"
                           [className]="'popup-color-picker'"
                           triangle="hide"
                           [color]="controlValue || ''"
                           [colors]="descriptor.presets || []"
                           (onChangeComplete)="changeColor($event)"></color-twitter>
            <div class="m-4 flex flex-row-reverse space-x-4 space-x-reverse">
                <button (click)="applyColor()">Ok</button>
                <button (click)="clearColor()">Clear</button>
            </div>
        </div>
    </ng-template>

</ng-container>
<ng-template #inlinePicker>
    <label [attr.title]="descriptor.hint">{{ descriptor.label }}</label>
    <color-sketch *ngIf="descriptor.colorMode !== 'presets'"
                  [className]="'inline-color-picker max-w-sm'"
                  [color]="controlValue || ''"
                  [presetColors]="descriptor.presets || []"
                  [disableAlpha]="descriptor.disableAlpha || false"
                  (onChangeComplete)="changeColor($event)"></color-sketch>
    <color-twitter *ngIf="descriptor.colorMode === 'presets'"
                   triangle="hide"
                   [className]="'inline-color-picker'"
                   [color]="controlValue || ''"
                   [colors]="descriptor.presets || []"
                   (onChangeComplete)="changeColor($event)"></color-twitter>
</ng-template>
