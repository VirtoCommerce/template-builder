<div [formGroup]="currentForm" class="p-4">
    <ng-container *ngFor="let control of descriptors">
        <!-- Header or Paragraph -->
        <h2 class="control-title" *ngIf="control.type === 'header'">{{ getContent(control) }}</h2>
        <p class="control-text" *ngIf="control.type === 'paragraph'">{{ getContent(control) }}</p>
        <!-- Simple control -->
        <!-- <app-control-holder *ngIf="displayEditor(control)" [descriptor]="control" [group]="group"
            [context]="context" [formControlName]="control.id"></app-control-holder> -->
        <!-- Info -->
        <!-- <p *ngIf="control.type !== 'image' && getInfo(control) !== undefined" class="form-help">
            {{getInfo(control)}}</p> -->

        <ng-container *ngIf="!!control.id">
            <app-control-holder [descriptor]="control"
                                [currentForm]="currentForm"
                                [context]="context"
                                [formControlName]="control.id">
            </app-control-holder>
        </ng-container>
    </ng-container>
</div>
