<div class="form-wrapper">
    <div *ngIf="form">
        <form [formGroup]="form">
            <app-controls-tabs [currentForm]="form"
                               [descriptors]="descriptors"
                               [context]="context">
            </app-controls-tabs>
        </form>
    </div>
    <div *ngIf="!descriptors || !descriptors.length">
        <p class="px-4">
            No settings for current section / block
        </p>
    </div>
</div>
